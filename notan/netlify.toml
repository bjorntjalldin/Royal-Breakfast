# Statisk PWA – inget byggsteg. Publicera mappen som den är.
[build]
  publish = "."
  command = "echo 'static site, no build'"

# Firebase web-config (apiKey/appId i firebase-config.js) är publika identifierare,
# inte hemligheter – åtkomst styrs av Firestore-reglerna. Undanta filen från scannern.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "firebase-config.js"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
